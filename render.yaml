services:
  - type: web
    name: rebootcord-web
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_VISION_MODEL
        value: prysmis-ai
      - key: AI_PROVIDER
        value: auto
    disk:
      name: rebootcord-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
  - type: worker
    name: rebootcord-bot
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: SITE_URL
        value: https://rebootcord.world
