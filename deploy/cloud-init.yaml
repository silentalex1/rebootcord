#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - rsync
  - openjdk-21-jre-headless
  - ufw
  - fail2ban
  - unattended-upgrades
  - htop

users:
  - name: rebootcord
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true

write_files:
  - path: /etc/sysctl.d/99-rebootcord.conf
    content: |
      vm.swappiness=10
      vm.max_map_count=262144
      net.core.somaxconn=4096
      net.ipv4.tcp_fin_timeout=15
      net.ipv4.ip_local_port_range=1024 65535
      fs.file-max=200000

  - path: /etc/security/limits.d/rebootcord.conf
    content: |
      rebootcord soft nofile 65536
      rebootcord hard nofile 65536
      rebootcord soft nproc 8192
      rebootcord hard nproc 8192

  - path: /etc/logrotate.d/rebootcord
    content: |
      /opt/rebootcord/data/*.log {
        daily
        rotate 7
        compress
        missingok
        notifempty
      }

runcmd:
  - sysctl --system
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 1000/tcp
  - ufw allow 25565:25864/tcp
  - ufw allow 25565:25864/udp
  - ufw --force enable
  - systemctl enable fail2ban
  - systemctl start fail2ban
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
