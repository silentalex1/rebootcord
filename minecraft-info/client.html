<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Client - Reboot Cord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0a;--surface:#111111;--surface2:#161616;--surface3:#1c1c1c;--surface4:#232323;--border:#232323;--border-bright:#2f2f2f;--text:#f4f4f4;--text-dim:#a3a3a3;--red:#ef4655;--mono:'IBM Plex Mono',monospace}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif,system-ui;min-height:100vh}
  a{color:inherit}
  .nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:64px;border-bottom:1px solid var(--border);background:rgba(10,10,10,0.85);backdrop-filter:blur(8px)}
  .nav-logo{font-weight:800;font-size:18px;letter-spacing:-0.02em}
  .nav-logo-r{color:var(--red)}
  .nav-logo-t{color:var(--text)}
  .btn-logout-nav{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border-bright);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
  .btn-logout-nav:hover{color:var(--text);background:var(--surface3)}
</style>
<link rel="stylesheet" href="/minecraft-info/client.css">
</head>
<body>
<nav class="nav">
  <div class="nav-logo" id="mcNavLogo" style="cursor:pointer">
    <span class="nav-logo-r">Reboot</span><span class="nav-logo-t"> Cord</span>
  </div>
  <div class="nav-right">
    <button class="btn-logout-nav" id="mcBackBtn">Back to Dashboard</button>
  </div>
</nav>
<div class="mc-client-page">
  <div class="mc-client-hero">
    <div class="mc-client-badge">Minecraft Client</div>
    <h1 class="mc-client-title">Reboot Cord Client</h1>
    <p class="mc-client-sub">The next step of Minecraft server hosting.</p>
  </div>
  <div class="mc-client-hill-scene">
    <div class="mc-client-sky"></div>
    <div class="mc-client-hill"></div>
  </div>
  <div class="mc-client-body" id="mcClientBody"></div>
</div>
<script src="/minecraft-info/client.js"></script>
</body>
</html>
